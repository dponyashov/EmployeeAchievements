version: "3.8"

services:
  db:
    image: postgres:17-alpine
    container_name: ea-db
    restart: always
    ports:
      - ${DB_PORT}:5432
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_PORT: ${DB_PORT}
    volumes:
      - ./var/db/postgresql:/var/lib/postgresql/data:rw

  ## Java-Spring
  backend-java:
    image: ea-back:0.0.1
    container_name: ea-back
    restart: always
    ports:
      - ${BACK_PORT}:8080
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      FRONT_URL: ${FRONT_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
    depends_on:
      - db

  ## React
  frontend:
    image: ea-front:0.0.1
    container_name: ea-front
    restart: always
    ports:
      - ${FRONT_PORT}:80
    depends_on:
      - backend-java
